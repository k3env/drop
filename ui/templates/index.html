<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Share</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Upload File</h1>
            <p class="subtitle">Share files instantly with a short link</p>

            <div class="file-drop-area" id="dropArea">
                <input type="file" id="fileInput" class="file-input">
                <label for="fileInput" class="file-label">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <span>Click to select or drag and drop a file</span>
                </label>
                <p class="file-name" id="fileName" style="display: none;"></p>
            </div>

            <button class="btn" id="uploadBtn" disabled>Upload File</button>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <p class="progress-text" id="progressText"></p>
            </div>

            <div class="error-message" id="errorMessage"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
