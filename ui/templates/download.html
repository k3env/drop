<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download File</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Download File</h1>
            <p class="subtitle">Get your file using the link below</p>

            <input type="hidden" id="token" value="{{.Token}}">

            <div class="file-info" id="fileInfo">
                <div class="file-info-item">
                    <span class="file-info-label">Filename</span>
                    <span class="file-info-value" id="filename">Loading...</span>
                </div>
                <div class="file-info-item">
                    <span class="file-info-label">Size</span>
                    <span class="file-info-value" id="filesize">Loading...</span>
                </div>
                <div class="file-info-item">
                    <span class="file-info-label">Expires in</span>
                    <span class="file-info-value" id="expiresAt">Loading...</span>
                </div>
                <div class="file-info-item">
                    <span class="file-info-label">Status</span>
                    <span class="file-info-value">
                        <span class="file-status" id="status">Loading...</span>
                    </span>
                </div>
            </div>

            <a href="/{{.Token}}/download" class="btn btn-download" id="downloadBtn">Download File</a>

            <div class="url-container">
                <input type="text" class="url-input" id="urlInput" value="{{.URL}}" readonly>
                <button class="btn btn-copy" id="copyBtn">Copy</button>
            </div>

            <div class="footer">
                <a href="/">Upload another file</a>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
