---
kind: pipeline
type: kubernetes
name: default

trigger:
  branch:
    - main
    - dev
    - ci
  event:
    - push
    - tag

steps:
  - name: frontend-build
    image: node:22-alpine
    volumes:
      - name: pnpm-cache
        path: /pnpm
    commands:
      - cd front
      - npm install -g pnpm
      - pnpm install --frozen-lockfile
      - pnpm run build
  - name: test
    image: golang:1.25
    volumes:
      - name: go-cache
        path: /go
    commands:
      - go mod download
      - go test ./...
    environment:
      GOPROXY: https://proxy.golang.org
      GOCACHE: /go/cache
      GOMODCACHE: /go/pkg/mod
      GOPRIVATE: "github.com/k3env/*"
  - name: build
    image: golang:1.25
    volumes:
      - name: go-cache
        path: /go
    commands:
      - go mod download
      - CGO_ENABLED=0 GOOS=linux go build -o drop -ldflags="-s -w" .
    environment:
      GOPROXY: https://proxy.golang.org
      GOCACHE: /go/cache
      GOMODCACHE: /go/pkg/mod
      GOPRIVATE: "github.com/k3env/*"
  - name: build-image
    image: plugins/kaniko
    volumes:
      - name: docker-cache
        path: /kaniko/.cache
    settings:
      registry: cr.koven.tech
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      repo: cr.koven.tech/k3env/drop
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
        - ${DRONE_BRANCH}

  - name: fetch-chart
    image: alpine/git
    volumes:
      - name: charts
        path: /charts
    environment:
      SSH_KEY:
        from_secret: ssh_key
    commands:
      - mkdir -p ~/.ssh
      - ssh-keyscan github.com >> ~/.ssh/known_hosts
      - git clone https://github.com/k3env/helm-charts.git /charts
    secrets:
      - ssh_key

  - name: deploy
    image: alpine/helm:3.14.0
    volumes:
      - name: charts
        path: /charts
    commands:
      - apk add --no-cache bash curl
      - |
        helm upgrade --install filedrop-production /charts/drop-share \
        --namespace home \
        --create-namespace \
        --reuse-values \
        --wait \
        --set app.image.tag=${DRONE_TAG:-${DRONE_COMMIT_SHA:0:8}}

volumes:
  - name: charts
    temp: {}
  - name: docker-cache
    claim:
      name: docker-cache-pvc
  - name: go-cache
    claim:
      name: go-cache-pvc
  - name: pnpm-cache
    claim:
      name: pnpm-cache-pvc